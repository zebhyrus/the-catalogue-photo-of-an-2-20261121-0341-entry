<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9fb"/>
      <stop offset="0.62" stop-color="#eef0f3"/>
      <stop offset="1" stop-color="#dfe2e7"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f5f7"/>
      <stop offset="1" stop-color="#d9dce0"/>
    </linearGradient>
    <linearGradient id="brickSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8eaed"/>
      <stop offset="1" stop-color="#c6c9cf"/>
    </linearGradient>
    <linearGradient id="battBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f3f5"/>
      <stop offset="0.5" stop-color="#c9ccd2"/>
      <stop offset="1" stop-color="#9aa0a8"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a06a"/>
      <stop offset="0.5" stop-color="#c47a3e"/>
      <stop offset="1" stop-color="#9c5a26"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- studio background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect y="700" width="1024" height="324" fill="#e6e8ec" opacity="0.55"/>

  <!-- floor shadows -->
  <ellipse cx="500" cy="668" rx="340" ry="30" fill="#1a1d22" opacity="0.16" filter="url(#soft)"/>
  <ellipse cx="800" cy="908" rx="150" ry="16" fill="#1a1d22" opacity="0.14" filter="url(#soft2)"/>

  <!-- cable loop: from right port, swooping down and around back into left port -->
  <path d="M 792 470 C 900 500, 940 580, 900 668 C 855 766, 700 812, 540 800 C 360 787, 220 730, 186 628 C 168 570, 178 512, 208 470"
        fill="none" stroke="#26292e" stroke-width="30" stroke-linecap="round"/>
  <g transform="translate(0,-6)">
    <path d="M 792 470 C 900 500, 940 580, 900 668 C 855 766, 700 812, 540 800 C 360 787, 220 730, 186 628 C 168 570, 178 512, 208 470"
          fill="none" stroke="#565b63" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- charger brick -->
  <rect x="208" y="322" width="588" height="292" rx="42" fill="url(#brick)" stroke="#c9ccd1" stroke-width="2"/>
  <rect x="222" y="336" width="560" height="46" rx="23" fill="#ffffff" opacity="0.65"/>
  <rect x="208" y="560" width="588" height="54" rx="27" fill="url(#brickSide)" opacity="0.5"/>

  <!-- ports -->
  <rect x="196" y="440" width="26" height="64" rx="10" fill="#2b2e33"/>
  <rect x="782" y="440" width="26" height="64" rx="10" fill="#2b2e33"/>
  <!-- plug collars where cable meets ports -->
  <rect x="176" y="448" width="34" height="48" rx="12" fill="#3a3d43"/>
  <rect x="796" y="448" width="34" height="48" rx="12" fill="#3a3d43"/>

  <!-- LED display -->
  <rect x="262" y="372" width="196" height="92" rx="14" fill="#101418"/>
  <rect x="262" y="372" width="196" height="92" rx="14" fill="none" stroke="#2e343a" stroke-width="2"/>
  <text x="360" y="436" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="bold"
        fill="#37d67a" text-anchor="middle">100%</text>
  <circle cx="436" cy="392" r="6" fill="#37d67a"/>

  <!-- brand + label on the brick -->
  <text x="600" y="436" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="bold"
        fill="#26292e" text-anchor="middle" letter-spacing="2">LOOP-1</text>
  <text x="512" y="540" font-family="Arial, Helvetica, sans-serif" font-size="27"
        fill="#5f636b" text-anchor="middle" letter-spacing="7">SELF-CHARGING</text>

  <!-- the one accessory: a single AA battery, lying unused -->
  <g transform="rotate(-8 800 862)">
    <rect x="700" y="830" width="206" height="62" rx="30" fill="url(#battBody)" stroke="#8b9098" stroke-width="2"/>
    <rect x="700" y="830" width="206" height="20" rx="10" fill="#ffffff" opacity="0.45"/>
    <rect x="700" y="830" width="44" height="62" rx="18" fill="url(#copper)"/>
    <rect x="688" y="846" width="16" height="30" rx="8" fill="#c47a3e"/>
    <rect x="748" y="830" width="10" height="62" fill="#26292e"/>
    <text x="724" y="874" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="bold"
          fill="#26292e" text-anchor="middle">+</text>
    <text x="836" y="872" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold"
          fill="#4a4e55" text-anchor="middle" letter-spacing="2">AA</text>
  </g>
</svg>
